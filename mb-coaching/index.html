<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>MB Coaching</title>
<link rel="icon" href="logo.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MB Coaching">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
:root {
  --bg: #0a0a0a;
  --card: #141414;
  --card2: #1b1b1b;
  --line: #262626;
  --text: #f2f2f2;
  --muted: #a6a6a6;
  --neon: #39ff14;
  --neon-dim: #39ff1422;
  --danger: #ff4d4d;
  --warn: #ffb300;
  --radius: 14px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --on-accent: #000; --g1: #161c16; --g2: #101310; --gb: #263626; --glow: #123a12; --nav: #0d0d0df2; --bar: #101010f5;
}
html[data-theme=blue] { --bg: #0f2fb5; --card: #1b44d8; --card2: #2250e6; --line: #4a6ff0; --text: #ffffff; --muted: #c3cfff; --neon: #ff6b6b; --on-accent: #fff; --g1: #2a55e6; --g2: #1d44c9; --gb: #5d7df5; --glow: #3a62f2; --nav: #0c2699f2; --bar: #0c2699f5; }
html[data-theme=light] { --bg: #f3eef5; --card: #ffffff; --card2: #f7f2f9; --line: #d9cfe0; --text: #1a1420; --muted: #6f6479; --neon: #c62828; --on-accent: #fff; --g1: #ffffff; --g2: #f8f4fa; --gb: #d9cfe0; --glow: #f3eef5; --nav: #ffffffee; --bar: #fffffff5; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; }
body { min-height: 100vh; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; font-weight: 700; letter-spacing: -0.01em; }
h1 { font-size: 22px; } h2 { font-size: 17px; } h3 { font-size: 15px; }
a { color: var(--neon); }
.muted { color: var(--muted); }
.neon { color: var(--neon); }
.hidden { display: none !important; }

/* layout */
.shell { display: flex; flex-direction: column; min-height: 100vh; padding-top: var(--safe-t); }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 20; padding-top: calc(14px + var(--safe-t)); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: .02em; }
.brand .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--neon); color: var(--on-accent); display: grid; place-items: center; font-weight: 900; font-size: 13px; }
.brand span.sub { color: var(--neon); }
.main { flex: 1; padding: 16px 16px calc(84px + var(--safe-b)); max-width: 1100px; width: 100%; margin: 0 auto; }
.nav { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: var(--nav); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding-bottom: var(--safe-b); z-index: 30; }
.nav button { flex: 1; background: none; border: 0; padding: 10px 4px 9px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; cursor: pointer; }
.nav button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav button.on { color: var(--neon); }

@media (min-width: 900px) {
  .shell { flex-direction: row; }
  .topbar { display: none; }
  .nav { position: sticky; top: 0; height: 100vh; width: 210px; flex-direction: column; justify-content: flex-start; border-top: 0; border-right: 1px solid var(--line); padding: 20px 12px; gap: 4px; background: var(--bg); backdrop-filter: none; }
  .nav .side-brand { display: flex !important; }
  .nav button { flex: none; flex-direction: row; gap: 12px; font-size: 15px; padding: 12px 14px; border-radius: 10px; justify-content: flex-start; }
  .nav button.on { background: var(--neon-dim); }
  .main { padding: 28px 32px 40px; }
}
.side-brand { display: none; margin: 0 6px 18px; }

/* componenti */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.wrap { flex-wrap: wrap; }
.grow { flex: 1; }
.gap { height: 14px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
@media (max-width: 520px) { .grid3 { grid-template-columns: 1fr; } }

.btn { background: var(--card2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; cursor: pointer; font-weight: 600; }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--neon); color: var(--on-accent); border-color: var(--neon); }
.btn.danger { color: var(--danger); border-color: #4a1f1f; }
.btn.small { padding: 6px 10px; font-size: 13px; border-radius: 8px; white-space: nowrap; }
.btn.ghost { background: transparent; }
.iconbtn { background: none; border: 0; color: var(--muted); font-size: 22px; cursor: pointer; padding: 4px 10px; }

label.f { display: block; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
label.f > span { display: block; margin-bottom: 5px; }
input, select, textarea { width: 100%; background: #0f0f0f; border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; outline: none; }
input:focus, select:focus, textarea:focus { border-color: var(--neon); }
input[type=color] { padding: 2px; height: 42px; }
input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--neon); }
textarea { min-height: 70px; resize: vertical; }
.chk { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; color: var(--text); font-size: 14px; }

.pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 99px; background: var(--card2); border: 1px solid var(--line); }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.avatar { width: 52px; height: 52px; border-radius: 50%; background: var(--card2); border: 1px solid var(--line); object-fit: cover; display: grid; place-items: center; font-weight: 800; color: var(--neon); flex: none; overflow: hidden; }
.avatar.big { width: 84px; height: 84px; font-size: 26px; }

.section-title { display: flex; align-items: center; justify-content: space-between; margin: 22px 0 10px; }
.stat { font-size: 26px; font-weight: 800; color: var(--neon); letter-spacing: -.02em; }
.stat small { font-size: 12px; color: var(--muted); font-weight: 500; display: block; letter-spacing: 0; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 600; font-size: 12px; }
td.r, th.r { text-align: right; }

/* calendario */
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.cal-head h2 { text-transform: capitalize; font-size: 19px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.cal-dow { text-align: center; color: var(--muted); font-size: 11px; padding: 4px 0; }
.cal-cell { min-height: 74px; background: var(--card); border-radius: 8px; padding: 4px; overflow: hidden; cursor: pointer; border: 1px solid transparent; }
.cal-cell.out { opacity: .35; }
.cal-cell.today { border-color: var(--neon); }
.cal-cell .d { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
.cal-cell.today .d { color: var(--neon); font-weight: 800; }
.chip { display: block; font-size: 10px; line-height: 1.25; font-weight: 700; color: #000; border-radius: 4px; padding: 2px 4px; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (min-width: 900px) { .cal-cell { min-height: 108px; } .chip { font-size: 12px; padding: 3px 6px; } }
@media (max-width: 520px) { .cal-cell { min-height: 58px; } .chip { font-size: 0; padding: 0; height: 6px; border-radius: 3px; } }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 12px 0; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.ev-item { display: flex; gap: 12px; align-items: stretch; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 8px; cursor: pointer; }
.ev-item .bar { width: 5px; border-radius: 3px; flex: none; }

/* modal */
#modal-root .overlay { position: fixed; inset: 0; background: #000000cc; z-index: 100; display: flex; align-items: flex-end; justify-content: center; }
#modal-root .sheet { background: var(--bg); border: 1px solid var(--line); border-radius: 18px 18px 0 0; width: 100%; max-width: 640px; max-height: 94vh; overflow-y: auto; padding: 16px 16px calc(20px + var(--safe-b)); }
@media (min-width: 900px) { #modal-root .overlay { align-items: center; } #modal-root .sheet { border-radius: 18px; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; position: sticky; top: -16px; background: var(--bg); padding: 4px 0 8px; z-index: 2; }
.subtle { font-size: 13px; color: var(--muted); }

#toast { position: fixed; left: 50%; bottom: calc(90px + var(--safe-b)); transform: translateX(-50%); background: var(--neon); color: var(--on-accent); font-weight: 700; padding: 10px 16px; border-radius: 99px; z-index: 200; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw; text-align: center; }
#toast.show { opacity: 1; }
#toast.err { background: var(--danger); color: #fff; }

/* login */
.login { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.login .box { width: 100%; max-width: 360px; text-align: center; }
.login .logo-big { width: 84px; height: 84px; border-radius: 22px; background: var(--neon); color: var(--on-accent); display: grid; place-items: center; font-size: 34px; font-weight: 900; margin: 0 auto 18px; }
.login h1 { font-size: 26px; margin-bottom: 4px; }
.login .btn { width: 100%; margin-top: 10px; }
.exp-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.exp-row:last-child { border-bottom: 0; }

.fcbar { position: fixed; left: 0; right: 0; bottom: calc(64px + var(--safe-b)); z-index: 25; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; background: var(--bar); border-top: 1px solid var(--neon); border-bottom: 1px solid var(--line); backdrop-filter: blur(10px); }
@media (min-width: 900px) { .fcbar { left: 210px; bottom: 0; } }
.drvg { grid-template-columns: 1fr !important; }
.sheet input:not([type=checkbox]):not([type=file]), .sheet select { height: 44px; }
.sheet [data-act=drvtab] { flex: 1; height: 40px; }
body { background: radial-gradient(900px 500px at 50% -80px, var(--glow) 0%, var(--bg) 60%) fixed; }
.tb { height: 46px; background: var(--card); border: 1px solid var(--line); color: var(--text); border-radius: 16px; padding: 0 14px; font-weight: 700; cursor: pointer; }
.hcard { display: flex; gap: 16px; align-items: center; background: linear-gradient(180deg, var(--g1), var(--g2)); border: 1px solid var(--gb); border-radius: 22px; padding: 18px; margin-bottom: 14px; cursor: pointer; }
.hcard .ico { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; flex: none; background: color-mix(in srgb, var(--neon) 15%, transparent); color: var(--neon); font-weight: 800; font-size: 18px; }
.hcard .ico svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.hcard h3 { font-size: 21px; margin: 0 0 4px; }
.hcard p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.35; }
.bigcard { background: linear-gradient(180deg, var(--g1), var(--g2)); border: 1px solid var(--gb); border-left: 6px solid var(--neon); border-radius: 22px; padding: 20px; margin-bottom: 16px; }
.lbl { font-size: 12px; letter-spacing: .09em; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
.val { font-size: 20px; font-weight: 600; margin-bottom: 16px; }
.tbn { background: var(--card); border: 1px solid var(--line); color: var(--text); border-radius: 16px; padding: 12px 16px; font-weight: 700; cursor: pointer; }
.pillbtn { display: inline-flex; align-items: center; gap: 8px; background: var(--neon); color: var(--on-accent); border-radius: 16px; padding: 12px 18px; font-weight: 800; letter-spacing: .03em; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
.badge { display: inline-block; border-radius: 99px; padding: 4px 11px; font-size: 12px; font-weight: 700; background: #ffffff14; color: #b8c2b8; }
.badge.bad { background: #ff4d4d26; color: #ff7b7b; }
.badge.warn { background: #ffb30026; color: #ffc233; }
.tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 12px 6px; border-radius: 16px; border: 1px solid var(--gb); background: var(--card); color: var(--text); font-weight: 600; font-size: 13px; cursor: pointer; }
.tile svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tile.on { background: var(--neon); color: var(--on-accent); border-color: var(--neon); }
.convrow { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--gb); border-radius: 16px; padding: 10px 14px; margin-bottom: 10px; }
.convrow label { width: 88px; flex: none; font-weight: 700; color: var(--muted); }
.convrow input { border: 0; background: transparent; font-size: 22px; font-family: ui-monospace, Menlo, monospace; padding: 0; }
.pgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
@media (min-width: 700px) { .pgrid { grid-template-columns: repeat(3, 1fr); } }
.pcard { border-radius: 20px; overflow: hidden; background: linear-gradient(180deg, var(--g1), var(--g2)); border: 1px solid var(--gb); cursor: pointer; }
.pphwrap { position: relative; background: linear-gradient(160deg, color-mix(in srgb, var(--pc) 75%, #000), color-mix(in srgb, var(--pc) 25%, #000)); }
.pph { height: 190px; background-size: cover; background-position: center top; display: grid; place-items: center; }
.pph span { font-size: 48px; font-weight: 900; color: #ffffffcc; }
.pnum { position: absolute; left: 0; bottom: 0; background: var(--neon); color: var(--on-accent); font-style: italic; font-weight: 900; font-size: 30px; line-height: 1.1; padding: 2px 20px 2px 12px; clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 100%, 0 100%); }
.pbody { padding: 12px 14px 14px; }
.pname { font-size: 17px; line-height: 1.2; }
.pname b { font-weight: 900; }
.pclass { font-size: 12px; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; margin: 4px 0 10px; min-height: 14px; }
.pstats { display: flex; gap: 26px; border-top: 1px solid var(--gb); padding-top: 10px; }
.pstats small { display: block; font-size: 11px; letter-spacing: .1em; color: var(--muted); }
.pstats b { font-size: 20px; font-family: ui-monospace, Menlo, monospace; }
.hscroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; scroll-snap-type: x mandatory; }
.hscroll .pcard { flex: none; width: 190px; scroll-snap-align: start; }
.pcard.compact .pph { height: 150px; }
.lbox { border: 1px solid var(--gb); border-radius: 20px; overflow: hidden; background: linear-gradient(180deg, var(--g1), var(--g2)); margin-bottom: 14px; }
.lhead { padding: 14px 16px; font-weight: 800; border-bottom: 1px solid var(--gb); }
.lrow { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--gb); cursor: pointer; }
.lrow:last-child { border-bottom: 0; }
.nbadge { width: 46px; height: 46px; border-radius: 12px; border: 1px solid var(--gb); display: grid; place-items: center; font-weight: 800; font-size: 17px; flex: none; }
.lcoach { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; padding-left: 10px; border-left: 2px solid var(--gb); font-size: 14px; color: var(--muted); }
.mono.sm { font-size: 13px; white-space: nowrap; }
.chev { color: var(--muted); font-size: 24px; flex: none; }
.dayhead { display: flex; align-items: center; gap: 10px; margin: 4px 0 10px; }
.arrow { width: 52px; height: 52px; border-radius: 16px; background: var(--card); border: 1px solid var(--gb); color: var(--neon); font-size: 30px; font-weight: 700; cursor: pointer; flex: none; line-height: 1; }
.tl { display: flex; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--neon); border-radius: 14px; padding: 12px; margin-bottom: 8px; cursor: pointer; }
.tlt { width: 58px; flex: none; font-size: 13px; color: var(--muted); }
.tlt b { font-size: 17px; color: var(--text); font-family: ui-monospace, Menlo, monospace; }
.bell { background: none; border: 1px solid var(--line); border-radius: 12px; width: 40px; height: 40px; font-size: 18px; cursor: pointer; flex: none; opacity: .6; }
.bell.on { border-color: var(--neon); opacity: 1; display: grid; place-items: center; }
.sgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.sgrid b { display: block; font-size: 26px; color: var(--neon); font-family: ui-monospace, Menlo, monospace; }
.sgrid small { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.sumrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--gb); font-size: 14px; margin-top: 10px; }
.sumrow > span { color: var(--muted); flex: none; }
.sumrow strong { text-align: right; }
.warnrow > span { color: var(--warn); }
.ctiles { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 700px) { .ctiles { grid-template-columns: 1fr 1fr; } }
.ctile { display: flex; align-items: center; gap: 14px; width: 100%; background: linear-gradient(180deg, var(--g1), var(--g2)); border: 1px solid var(--gb); border-left: 6px solid var(--cc); border-radius: 18px; padding: 16px; color: var(--text); cursor: pointer; font: inherit; }
.ctile strong { font-size: 17px; }
.cdot { width: 14px; height: 14px; border-radius: 50%; background: var(--cc); flex: none; box-shadow: 0 0 12px var(--cc); }
.selbox { width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--gb); background: var(--card2); color: var(--neon); font-size: 20px; font-weight: 800; cursor: pointer; flex: none; }
.selbox.on { background: var(--neon); color: var(--on-accent); border-color: var(--neon); }
.actrow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
.abtn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 12px 4px; border-radius: 16px; background: var(--card); border: 1px solid var(--gb); color: var(--neon); font-size: 22px; text-decoration: none; cursor: pointer; font-family: inherit; }
.abtn span { font-size: 12px; color: var(--text); font-weight: 600; }
.abtn.off { opacity: .4; cursor: default; grid-column: span 2; }
.icard { display: flex; gap: 12px; align-items: flex-start; background: linear-gradient(180deg, var(--g1), var(--g2)); border: 1px solid var(--gb); border-radius: 18px; padding: 14px; margin-bottom: 10px; cursor: pointer; }
.irow { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; font-size: 14px; }
.irow > span { color: var(--muted); }
.irow b { text-align: right; font-family: ui-monospace, Menlo, monospace; }
.hist { margin-bottom: 10px; }
.hist [data-act=evview] { cursor: pointer; }
.aglist { font-size: 13px; color: var(--muted); margin: 8px 0 4px; padding-left: 4px; }
.aglist > div { padding: 3px 0; cursor: pointer; }
.badge.ok { background: color-mix(in srgb, var(--neon) 20%, transparent); color: var(--neon); }
.nline { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 8px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
.segb { padding: 12px 6px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--text); font-weight: 700; font-size: 13px; cursor: pointer; --pc: var(--muted); border-left: 4px solid var(--pc); }
.segb.on { background: var(--pc); color: #000; border-color: var(--pc); }
.segb:first-child.on { background: var(--neon); color: var(--on-accent); border-color: var(--neon); }

/* ---- campi leggibili ---- */
:root { --inbg: #f4f6f4; --intx: #101210; --inln: #c9d1c9; --sheet: #161916; }
html[data-theme=blue] { --inbg: #ffffff; --intx: #0f1d55; --inln: #9fb3ff; --sheet: #1b44d8; }
html[data-theme=light] { --inbg: #ffffff; --intx: #1a1420; --inln: #cbbfd4; --sheet: #ffffff; }
input, select, textarea { background: var(--inbg); color: var(--intx); border: 1.5px solid var(--inln); font-size: 16px; }
input::placeholder, textarea::placeholder { color: #8a908a; }
input:focus, select:focus, textarea:focus { border-color: var(--neon); box-shadow: 0 0 0 3px color-mix(in srgb, var(--neon) 30%, transparent); }

function resizeImage(file, max, quality = 0.82) {
  return new Promise((resolve) => {
    if (!file.type.startsWith('image/')) return resolve(file);
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const cx = c.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, c.width, c.height); cx.drawImage(img, 0, 0, c.width, c.height);
      c.toBlob((b) => { URL.revokeObjectURL(url); resolve(b || file); }, 'image/jpeg', quality);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

function calPage() {

function calView() {
  const m = S.month;
  const first = new Date(m.getFullYear(), m.getMonth(), 1);
  const gridStart = addDays(first, -((first.getDay() + 6) % 7));
  const todayS = iso(new Date());
  let cells = '';
  for (let i = 0; i < 42; i++) {
    const d = addDays(gridStart, i), ds = iso(d);
    const evs = S.events.filter((e) => e.start_date <= ds && ds <= e.end_date && calOk(e));
    const chips = evs.slice(0, 3).map((e) => `<span class="chip" data-act="dayview" data-date="${ds}" style="background:${evColor(e)}">${esc(driver(e.driver_id)?.last_name || '')}</span>`).join('');
    const more = evs.length > 3 ? `<span class="muted" style="font-size:10px">+${evs.length - 3}</span>` : '';
    cells += `<div class="cal-cell ${d.getMonth() !== m.getMonth() ? 'out' : ''} ${ds === todayS ? 'today' : ''}" data-act="dayview" data-date="${ds}"><div class="d">${d.getDate()}</div>${chips}${more}</div>`;
  }
  const upcoming = S.events.filter((e) => e.end_date >= todayS && calOk(e) && seasonOk(e)).sort((a, b) => a.start_date.localeCompare(b.start_date)).slice(0, 20);
  const lb = (k, id, name, col) => { const on = CALF && CALF.k === k && CALF.id === id; return `<button class="btn small" data-act="calfilter" data-k="${k}" data-id="${id}" style="${on ? `background:${col};color:#000;border-color:${col}` : `border-color:${col}`}"><i class="dot" style="background:${on ? '#000' : col}"></i> ${esc(name)}</button>`; };
  const legend = `<button class="btn small ${CALF ? '' : 'primary'}" data-act="calfilter" data-k="" data-id="">Tutti</button>` +
    S.champs.map((c) => lb('c', c.id, c.name + champFlag(c), c.color)).join('');
  const legend2 = S.types.filter((t) => t.color).map((t) => lb('t', t.id, t.name, t.color)).join('') +
    '<button class="btn small" data-act="newtype" title="Nuova attività" style="border-style:dashed">＋</button>';
  const fname = CALF ? (CALF.k === 'c' ? champ(CALF.id)?.name : atype(CALF.id)?.name) : '';
  const nUp = S.events.filter((e) => e.end_date >= todayS && calOk(e)).length;
  const filterBar = `<div class="row wrap" style="gap:6px;margin-bottom:10px;align-items:center"><button class="btn small ${CALF ? 'primary' : ''}" data-act="legtoggle">${CALF ? esc(fname) : 'Filtra per campionato'} ${S.legendOpen ? '▴' : '▾'}</button>${CALF ? '<button class="btn small" data-act="calfilter" data-k="" data-id="">✕ Tutti</button>' : ''}<span class="subtle">${nUp} ${nUp === 1 ? 'evento' : 'eventi'} in programma</span></div>${S.legendOpen ? `<div class="legend" style="flex-direction:column;align-items:flex-start;gap:8px;margin-top:0">${legend}${legend2}</div>` : ''}${CALF && !nUp ? '<p class="muted" style="margin:0 0 10px">Nessun evento per questo filtro: aggiungili da "+ Aggiungi dai campionati".</p>' : ''}`;
  return `
    <button class="tbn" data-act="go" data-v="events" style="margin-bottom:12px">← Eventi</button>
    <div class="row between wrap" style="margin-bottom:12px">
      <h1>Calendario</h1>
      <div class="row">
        <button class="btn small" data-act="gsync">⟳ Sincronizza Google</button>
        <button class="btn primary small" data-act="newevent">+ Evento</button>
      </div>
    </div>
    ${filterBar}
    <div class="cal-head">
      <button class="btn small" data-act="prevm">‹</button>
      <h2>${MONTHS()[m.getMonth()]} ${m.getFullYear()}</h2>
      <button class="btn small" data-act="nextm">›</button>
    </div>
    <div class="cal-grid">${['Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab', 'Dom'].map((x) => `<div class="cal-dow">${x}</div>`).join('')}${cells}</div>
    
    <div class="section-title"><h2>Prossimi eventi</h2></div>
    ${upcoming.length ? groupEvents(upcoming).map(evGroupItem).join('') : '<p class="muted">Nessun evento in programma.</p>'}`;
}

function updateTotal() {

function eventChanged(f, name) {
  const g = (n) => f.elements[n];
  if (name === 'ev_group') {
    const gv = g('ev_group').value, pv = gv === 'dea' || gv === 'mpa' ? gv : '';
    if (g('program')) { g('program').value = pv; f.querySelectorAll('[data-act=progpick]').forEach((b) => b.classList.toggle('on', b.dataset.id === pv)); }
    const list = S.types.filter((t) => evGrp(t) === gv);
    g('activity_type_id').innerHTML = opts(list, list[0]?.id, (t) => t.name);
    return eventChanged(f, 'activity_type_id');
  }
  if (name === 'driver_id' || name === 'activity_type_id') {
    const d = driver(g('driver_id').value), t = atype(g('activity_type_id').value);
    $('#f-champ').classList.toggle('hidden', t?.needs_championship === false);
    if (t?.needs_championship === false) g('championship_id').value = '';
    else if (name === 'driver_id' && d?.championship_id) g('championship_id').value = d.championship_id;
    if (name === 'driver_id' && d) {
      if (g('team_id') && !g('team_id').value && d.team_id) g('team_id').value = d.team_id;
      g('engineer_name').value = d.engineer_name || ''; g('engineer_phone').value = d.engineer_phone || '';
      g('mechanic_name').value = d.mechanic_name || ''; g('mechanic_phone').value = d.mechanic_phone || '';
    }
    eventChanged(f, 'championship_id');
  }
  if (name === 'championship_id') {
    const c = champ(g('championship_id').value);
    g('race_director_name').value = c?.race_director_name || '';
    g('race_director_phone').value = c?.race_director_phone || '';
  }
  if (name === 'start_date' || name === 'end_date') {
    if (g('end_date').value < g('start_date').value) g('end_date').value = g('start_date').value;
    g('days').value = diffDays(g('start_date').value, g('end_date').value);
  }
  updateTotal();
}

    hotel_name: val('hotel_name'), hotel_address: val('hotel_address'), hotel_arrive: val('hotel_arrive'), hotel_depart: val('hotel_depart'), hotel_conf: val('hotel_conf'), flights: '', hotel_phone: val('hotel_phone'), flights_hh: val('flights_hh'), flights_mb: val('flights_mb'), flights_other_name: val('flights_other_name'), flights_other: val('flights_other'), car_rental: val('car_rental'), car_conf: val('car_conf'), car_notes: val('car_notes'),
    paid: fd.get('paid') === 'on', notes: val('notes'), program: val('program'), dirty: true
  };
  if (!p.driver_id) p.driver_id = 'x:Da definire';
  if (!p.start_date) p.start_date = p.end_date || iso(new Date());
  if (!p.end_date || p.end_date < p.start_date) p.end_date = p.start_date;
  const isNew = !f.dataset.id;
  const id = f.dataset.id || uuid();
  const old = S.events.find((x) => x.id === id);
  await put('events', { ...(old || {}), ...p, id });
  autoPush(id);
  toast('Evento salvato');
  if (isNew) { eventForm(id); render(); } else { closeModal(); render(); }
}

/* ---------- SPESE ---------- */
function expensesBlock(e, exps) {
  if (isLocked()) return `<div class="card" data-act="unlockev" data-id="${e.id}" style="cursor:pointer;text-align:center;padding:18px;margin-top:14px">🔒 Spese protette da password<br><b>Tocca per sbloccare</b></div>`;
  const byCur = {};
  exps.forEach((x) => { byCur[x.currency] = (byCur[x.currency] || 0) + Number(x.amount); });
  return `<div class="section-title"><h2>Spese</h2><span class="subtle">${Object.entries(byCur).map(([c, n]) => money(n, c)).join(' · ') || ''}</span></div>
  <div class="card">
    ${exps.length ? exps.map((x) => `<div class="exp-row">
        <div class="grow" style="min-width:0">
          <div><strong>${CATS[x.category]}</strong> <span class="pill">${PAYERS[x.paid_by]}${x.paid_by_note ? ': ' + esc(x.paid_by_note) : ''}</span></div>
          <div class="subtle">${fmtShort(x.expense_date)} · ${money(x.amount, x.currency)}${x.notes ? ' · ' + esc(x.notes) : ''}</div>
        </div>
        ${x.receipt_data ? `<button class="btn small ghost" data-act="exp-receipt" data-id="${x.id}">🧾</button>` : ''}
        <button class="btn small ${x.reimbursed ? 'primary' : ''}" data-act="exp-toggle" data-id="${x.id}">${x.reimbursed ? 'Rimborsata' : 'Da rimborsare'}</button>
        <button class="iconbtn" data-act="exp-del" data-id="${x.id}">🗑</button>
      </div>`).join('') : '<p class="muted" style="margin:0">Nessuna spesa registrata.</p>'}
  </div>
  <form data-form="expense" data-event="${e.id}" class="card" style="margin-top:10px">
    <h3 style="margin-bottom:10px">Aggiungi spesa</h3>
    <div class="grid2">
      <label class="f"><span>Categoria</span>${catSelect()}</label>
      <label class="f"><span>Data</span><input type="date" name="expense_date" value="${iso(new Date())}"></label>
      <label class="f"><span>Importo</span><input type="number" step="0.01" name="amount" required></label>
      <label class="f"><span>Valuta</span><select name="currency">${CURS.map((c) => `<option ${c === e.currency ? 'selected' : ''}>${c}</option>`).join('')}</select></label>
      <label class="f"><span>A carico di</span><select name="paid_by">${Object.entries(PAYERS).map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select></label>
      <label class="f"><span>Se "Altro", chi</span><input name="paid_by_note"></label>
    </div>
    <label class="f"><span>Note</span><input name="notes"></label>
    <label class="f"><span>Foto scontrino</span><input type="file" name="receipt" accept="image/*,application/pdf,.pdf"></label>
    <button class="btn primary" type="submit">Aggiungi spesa</button>
  </form>`;
}


async function saveExpense(f) {
  const fd = new FormData(f);
  const eventId = f.dataset.event;
  const row = {
    id: uuid(), event_id: eventId, category: catValue(fd), expense_date: fd.get('expense_date'),
    amount: Number(fd.get('amount')), currency: fd.get('currency'), paid_by: fd.get('paid_by'),
    paid_by_note: (fd.get('paid_by_note') || '').toString().trim() || null,
    notes: (fd.get('notes') || '').toString().trim() || null, reimbursed: false, receipt_data: null
  };
  if (!row.amount) return toast('Inserisci l\'importo', true);
  const file = fd.get('receipt');
  if (file && file.size) row.receipt_data = await receiptDataUrl(file);
  try { await put('expenses', row); } catch (err) { return toast('Errore: ' + (err.message || err.code), true); }
  toast('Spesa aggiunta');
  eventForm(eventId);
  render();
}

const DEFAULT_PHOTOS = [[/^hummel$/i, PH_HUMMEL], [/^perus?qu/i, PH_LUIS]];
function pphoto(d) { return (d && d.photo_data) || ((DEFAULT_PHOTOS.find(([re]) => re.test((d && d.last_name) || '')) || [])[1] || ''); }
function avatar(d, big) {
  return pphoto(d) ? `<img class="avatar ${big ? 'big' : ''}" src="${pphoto(d)}" alt="">` : `<div class="avatar ${big ? 'big' : ''}">${esc(initials(d))}</div>`;
}
function driverForm(id) {
  const d = id ? driver(id) : { first_name: '', last_name: '', active: true };
  const rate = (tid) => S.rates.find((r) => r.driver_id === id && r.activity_type_id === tid);
  S.drvTab = 'main';
  const earn = (() => {
    if (!id) return '';
    const o = {};
    S.events.filter((e) => e.driver_id === id).forEach((e) => {
      const { rate: rt, cur } = evComp(e);
      const c = (o[cur] ||= { tot: 0, paid: 0, days: 0 }), v = e.days * rt;
      c.tot += v; c.days += e.days; if (e.paid) c.paid += v;
    });
    const k = Object.keys(o);
    return `<div class="card" style="margin-bottom:12px"><div class="subtle" style="margin-bottom:6px">Guadagni cumulativi</div>${k.length ? k.map((c) => `<div class="stat" style="font-size:22px">${money(o[c].tot, c)}<small>${o[c].days} giorni · incassato ${money(o[c].paid, c)} · da incassare ${money(o[c].tot - o[c].paid, c)}</small></div>`).join('') : '<span class="muted">Nessun evento</span>'}</div>`;
  })();
  const tabBtn = (k, l) => `<button type="button" class="btn small ${k === 'main' ? 'primary' : ''}" data-act="drvtab" data-id="${k}">${l}</button>`;
  const pct = d.coach_pct != null && d.coach_pct !== '' ? (100 - Number(d.coach_pct)).toLocaleString(LOC(), { maximumFractionDigits: 1 }) + ' %' : '—';
  openModal(id ? esc(dname(d)) : 'Nuovo pilota', `
  <div class="row" style="gap:6px;margin-bottom:14px">${tabBtn('main', 'Pilota')}${tabBtn('team', 'Team e contatti')}${tabBtn('bill', 'Fatturazione')}</div>
  <form data-form="driver" data-id="${id || ''}">
    <div data-tabpanel="main">
      <div class="row" style="margin-bottom:12px">${avatar(d, true)}<label class="f grow" style="margin:0"><span>Foto</span><input type="file" name="photo" accept="image/*"></label></div>
      ${id ? `<div class="row" style="gap:6px;margin-bottom:12px">${contactBtns(d.phone, d.email) || '<span class="subtle">Aggiungi telefono o mail per avere i bottoni</span>'}</div>` : ''}
      <div class="grid2">
        <label class="f"><span>Nome</span><input name="first_name" value="${esc(d.first_name)}" required></label>
        <label class="f"><span>Cognome</span><input name="last_name" value="${esc(d.last_name)}" required></label>
      </div>
      <div class="grid2">
        <label class="f"><span>Numero di gara</span><input name="race_number" inputmode="numeric" value="${esc(d.race_number)}"></label>
        <label class="f"><span>Numero cliente Ferrari</span><input name="customer_number" value="${esc(d.customer_number)}"></label>
        <label class="f"><span>Nazione</span><select name="nation_code"><option value="">\u2014</option>${COUNTRIES.map(([c, n]) => `<option value="${c}" ${d.nation_code === c ? 'selected' : ''}>${flagOf(c)} ${n}</option>`).join('')}</select></label>
      </div>
      <label class="f"><span>Classe</span><select name="race_class"><option value="">\u2014</option>${CLASSES.map((c) => `<option ${d.race_class === c ? 'selected' : ''}>${c}</option>`).join('')}</select></label>
      <label class="f"><span>Telefono</span><input type="tel" name="phone" value="${esc(d.phone)}"></label>
      <label class="f"><span>Mail</span><input type="email" name="email" value="${esc(d.email)}"></label>
      <label class="f"><span>Mail per note spese e fatture (se diversa)</span><input type="email" name="billing_email" value="${esc(d.billing_email)}" placeholder="es. amministrazione o assistente"></label>

async function drvEdit(el) {
  const e = S.events.find((x) => x.id === el.dataset.ev);
  if (!e) return;
  const row = { ...e };
  const rateFor = (tid) => S.rates.find((r) => r.driver_id === e.driver_id && r.activity_type_id === tid);
  if (el.dataset.fld === 'days') {
    row.days = Math.max(0, Number(el.value) || 0);
    if (!row.daily_rate) { const r = rateFor(e.activity_type_id); if (r) { row.daily_rate = r.daily_rate; row.currency = r.currency; } }
  } else if (el.dataset.fld === 'rate') {
    row.daily_rate = Math.max(0, Number(String(el.value).replace(',', '.')) || 0);
  } else if (el.dataset.fld === 'cur') {
    row.currency = el.value;
  } else if (el.dataset.fld === 'paid') {
    row.paid = !!el.checked;
  } else if (el.dataset.fld === 'type' || el.dataset.fld === 'group') {
    row.activity_type_id = el.dataset.fld === 'group' ? (S.types.find((t) => typeGroup(t) === el.value)?.id || e.activity_type_id) : el.value;
    if (atype(row.activity_type_id)?.needs_championship === false) row.championship_id = null;
    const r = rateFor(row.activity_type_id);
    if (r) { row.daily_rate = r.daily_rate; row.currency = r.currency; }
  }
  row.dirty = true;
  await put('events', row);
  if (el.dataset.fld !== 'days') autoPush(row.id);
  const box = $('#drvsum');
  if (box) box.outerHTML = driverSummary(box.dataset.did);
  render();
  toast('Salvato');
}

function driverSummary(did) {
  const evs = S.events.filter((e) => e.driver_id === did).sort((a, b) => b.start_date.localeCompare(a.start_date));

    const t = atype(e.activity_type_id), c = champ(e.championship_id);
    const { rate, cur } = evComp(e);
    const comp = e.days * rate;
    const dd = driver(did), cmode = dd?.coach_mode || 'pct', cpay = Number(dd?.coach_pay ?? dd?.coach_pct) || 0;

    const pct = cpay;
    const exps = S.expenses.filter((x) => x.event_id === e.id).sort((a, b) => a.expense_date.localeCompare(b.expense_date));

        <div class="f" style="margin:0"><span>Compenso giornaliero</span><div style="padding-top:8px;font-weight:700">${rate ? money(rate, cur) : 'non impostato'}</div></div>
      </div>
      <table style="margin-top:8px">
        <tr><td>Compenso (${e.days} gg × ${money(rate, cur)})</td><td class="r">${money(comp, cur)}</td><td class="r subtle">${e.paid ? 'incassato' : 'da incassare'}</td></tr>${pct ? `<tr><td>Quota coach${dd?.coach_name ? ' (' + esc(dd.coach_name) + ')' : ''} \u00b7 ${cmode === 'day' ? money(cpay, cur) + '/gg' : cpay + '%'}</td><td class="r">\u2212${money(coachAmt, cur)}</td><td></td></tr><tr><td><strong>Resta a me${comp ? ' \u00b7 ' + Math.round((comp - coachAmt) / comp * 100) + '%' : ''}</strong></td><td class="r"><strong>${money(comp - coachAmt, cur)}</strong></td><td></td></tr>` : ''}
        ${exps.map((x) => `<tr><td>${CATS[x.category]} <span class="subtle">· ${fmtShort(x.expense_date)} · ${PAYERS[x.paid_by]}${x.paid_by_note ? ': ' + esc(x.paid_by_note) : ''}</span></td><td class="r">${money(x.amount, x.currency)}</td><td class="r subtle">${x.reimbursed ? 'rimborsata' : 'da rimborsare'}</td></tr>`).join('')}

  }).join('');

function parseRacePlan(text) {
  const out = [];
  const t = String(text || '').replace(/\r/g, '');
  if (/BEGIN:VEVENT/i.test(t)) {
    const unf = t.replace(/\n[ \t]/g, '');
    unf.split(/BEGIN:VEVENT/i).slice(1).forEach((blk) => {
      const g = (k) => { const m = blk.match(new RegExp('^' + k + '([^:\\n]*):(.*)$', 'im')); return m ? { params: m[1], val: m[2].trim() } : null; };
      const su = g('SUMMARY'), ds = g('DTSTART'), de = g('DTEND'), lo = g('LOCATION');
      if (!su || !ds) return;
      const d8 = (v) => { const m = v.match(/(\d{4})(\d{2})(\d{2})/); return m ? `${m[1]}-${m[2]}-${m[3]}` : null; };
      const s = d8(ds.val); if (!s) return;
      let e = de ? d8(de.val) : s;
      if (de && /VALUE=DATE(?!-)/i.test(de.params) && e && e > s) e = iso(addDays(parse(e), -1));
      out.push({ name: su.val.replace(/\\,/g, ',').replace(/\\n/g, ' '), nat: lo ? lo.val.replace(/\\,/g, ',') : null, s, e: e || s });
    });
    return out;
  }
  const lines = t.split('\n').filter((l) => l.trim());
  if (lines.length < 2) return out;
  const sep = (lines[0].match(/;/g) || []).length >= (lines[0].match(/,/g) || []).length ? ';' : ',';
  const split = (l) => { const r = []; let cur = '', q = false; for (const ch of l) { if (ch === '"') q = !q; else if (ch === sep && !q) { r.push(cur); cur = ''; } else cur += ch; } r.push(cur); return r.map((x) => x.trim()); };
  const head = split(lines[0]).map((x) => x.toLowerCase());
  const has = (h, ks) => ks.some((k) => h.includes(k));
  const iE = head.findIndex((h) => has(h, ['fine', 'end']) || ['al', 'to'].includes(h));
  const iS = head.findIndex((h, i) => i !== iE && (has(h, ['inizio', 'start', 'from']) || ['dal', 'data', 'date'].includes(h)));
  const iN = head.findIndex((h, i) => i !== iE && i !== iS && has(h, ['evento', 'event', 'nome', 'name', 'titolo', 'title', 'circuit', 'gara', 'race']));
  const iC = head.findIndex((h) => has(h, ['nazion', 'country', 'paese', 'luogo', 'location']));
  const dt = (v) => { if (!v) return null; let m = v.match(/(\d{4})-(\d{2})-(\d{2})/); if (m) return `${m[1]}-${m[2]}-${m[3]}`; m = v.match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/); if (m) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${pad(+m[2])}-${pad(+m[1])}`; } return null; };
  lines.slice(1).forEach((l) => {
    const c = split(l);
    const s = dt(c[iS >= 0 ? iS : 1]);
    if (!s) return;
    out.push({ name: c[iN >= 0 ? iN : 0] || 'Evento', nat: iC >= 0 ? (c[iC] || null) : null, s, e: dt(iE >= 0 ? c[iE] : null) || s });
  });
  return out;
}
async function planSave(typeId, items) {

    await put('planev', { id: uuid(), activity_type_id: typeId, name: it.name, nat: it.nat || null, s: it.s, e: it.e || it.s });

  }
  S.planev.sort((a, b) => a.s.localeCompare(b.s));
  return n;

async function sendMail(f, how) {
  const fd = new FormData(f);
  const list = (n) => (fd.get(n) || '').toString().split(/[,;\s]+/).map((x) => x.trim()).filter(Boolean);
  const input = { to: list('to'), cc: list('cc'), subject: (fd.get('subject') || '').toString(), body: (fd.get('body') || '').toString(), includeSignature: true };

function yearOk(e) { return S.year === 0 || +e.start_date.slice(0, 4) === S.year; }
function drvTotals(did, filt) {
  const o = { tot: {}, paid: {}, due: {}, exp: {}, days: 0, n: 0 };
  S.events.filter((e) => e.driver_id === did && filt(e)).forEach((e) => {
    const { cur, comp } = evComp(e);
    o.n++; o.days += Number(e.days) || 0;
    addTo(o.tot, cur, comp); addTo(e.paid ? o.paid : o.due, cur, comp);
    S.expenses.filter((x) => x.event_id === e.id && !x.reimbursed && x.paid_by === 'pilota').forEach((x) => addTo(o.exp, x.currency, Number(x.amount)));
  });
  return o;
}

function billData(did, ym) {

    if (!comp && !exps.length) return;

  const todayS = iso(new Date());
  const cards = evs.map((e) => {
    const t = atype(e.activity_type_id), c = champ(e.championship_id), { rate, cur, comp } = evComp(e);
    const coachAmt = !cpay ? 0 : (cmode === 'day' ? (Number(e.days) || 0) * cpay : comp * cpay / 100);
    addTo(T.tot, cur, comp); addTo(e.paid ? T.paid : T.due, cur, comp); addTo(T.coach, cur, coachAmt); addTo(prog, cur, comp);
    const ag = agendaFor(d.id, e);
    const ex = S.expenses.filter((x) => x.event_id === e.id), exT = {}; ex.forEach((x) => addTo(exT, x.currency, Number(x.amount)));
    return `<div class="card hist" style="border-left:4px solid ${evColor(e)}">
      <div class="row between" style="gap:8px;align-items:flex-start"><div style="min-width:0" data-act="evview" data-id="${e.id}"><strong>${esc(e.circuit || c?.name || t?.name || 'Evento')}</strong><div class="subtle">${fmtRange(e.start_date, e.end_date)} ${e.start_date.slice(0, 4)} · ${esc(t?.name || '')}${c ? ' · ' + esc(c.name) : ''}</div></div><button class="btn small ${e.paid ? 'primary' : ''}" data-act="paidtoggle" data-id="${e.id}" style="flex:none">${e.paid ? 'Incassato' : e.end_date > todayS ? 'In programma' : 'Da incassare'}</button></div>
      ${ag.length ? `<div class="aglist">${ag.map((a) => `<div data-act="agedit" data-id="${a.id}">• ${fmtShort(a.date)} ${esc(a.start)} — ${esc(a.title)}</div>`).join('')}</div>` : ''}
      <div class="irow"><span>Compenso ${e.days} gg × ${rate ? money(rate, cur) : '<span style="color:var(--warn)">tariffa?</span>'}</span><b>${money(comp, cur)}</b></div>
      ${ex.length ? `<div class="irow"><span>Spese (${ex.length})</span><b>${sumTxt(exT)}</b></div>` : ''}
      <div class="irow"><span>Progressivo compensi</span><b class="neon">${sumTxt(prog)}</b></div>
      <div class="row wrap" style="gap:6px;margin-top:8px"><button class="btn small" data-act="event" data-id="${e.id}">✎ Compenso e spese</button>${noteChip(e)}</div></div>`;
  }).join('');
  const inAny = (a) => allEv.some((e) => a.date >= e.start_date && a.date <= e.end_date);
  const loose = (S.agenda || []).filter((a) => a.driver_id === d.id && !inAny(a) && (!per || a.date.startsWith(per))).sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));
  const exps = S.expenses.filter((x) => evs.some((e) => e.id === x.event_id));
  const byCat = {}, byPay = {};
  exps.forEach((x) => { (byCat[x.category] ||= {}); addTo(byCat[x.category], x.currency, Number(x.amount)); const k = x.paid_by + '|' + (x.reimbursed ? 'r' : 'd'); (byPay[k] ||= {}); addTo(byPay[k], x.currency, Number(x.amount)); });
  const payRows = Object.keys(PAYERS).map((p) => { const dd = byPay[p + '|d'] || {}, rr = byPay[p + '|r'] || {}; return (sumTxt(dd) || sumTxt(rr)) ? `<tr><td>A carico ${PAYERS[p].toLowerCase()}</td><td class="r mono">${sumTxt(dd) || '—'}</td><td class="r mono subtle">${sumTxt(rr) || '—'}</td></tr>` : ''; }).join('');
  const { tot: invTot, lines } = billData(d.id, per);
  const teamDue = {}; exps.filter((x) => x.paid_by === 'team' && !x.reimbursed).forEach((x) => addTo(teamDue, x.currency, Number(x.amount)));
  const coachTxt = sumTxt(T.coach);
  const mine = {}; Object.entries(T.tot).forEach(([c, n]) => addTo(mine, c, n - (T.coach[c] || 0)));
  const notes = notesOf(d.id).filter((n) => !per || (n.date || '').startsWith(per));
  const open = {}; notes.filter((n) => n.status !== 'pagata').forEach((n) => Object.entries(noteTotals(n.lines)).forEach(([c, v]) => addTo(open, c, v)));
  const bm = billMail(d);
  return `<div class="row between" style="margin-bottom:14px"><button class="tbn" data-act="go" data-v="money">← Incassi</button><button class="btn small" data-act="driver" data-id="${d.id}">Scheda pilota</button></div>
  <div class="two"><div class="colA sticky">
  <div class="row" style="gap:12px;margin-bottom:10px">${avatar(d, true)}<div style="min-width:0"><h1 style="font-size:24px">${esc(dname(d))}</h1><div class="subtle">Fatturazione · storico progressivo</div></div></div>
  <div class="card row between" style="gap:8px;margin-bottom:12px"><div style="min-width:0"><div class="subtle">Note spese inviate a</div><strong style="word-break:break-all">${esc(bm.to || 'nessuna mail')}</strong>${bm.cc ? `<div class="subtle" style="word-break:break-all">cc ${esc(bm.cc)}</div>` : ''}</div><button class="btn small" data-act="drvedit" data-id="${d.id}">Cambia</button></div>
  <label class="f"><span>Periodo</span><select id="billper"><option value="">Tutto (progressivo)</option>${yrs.map((y) => `<option value="${y}" ${per === y ? 'selected' : ''}>Anno ${y}</option>`).join('')}${months.map((m) => `<option value="${m}" ${per === m ? 'selected' : ''}>${cap(MONTHS()[+m.slice(5) - 1])} ${m.slice(0, 4)}</option>`).join('')}</select></label>
  <div class="bigcard" style="padding:16px"><div class="irow"><span>Totale compensi</span><b style="font-size:17px">${sumTxt(T.tot) || '—'}</b></div><div class="irow"><span>Incassato</span><b>${sumTxt(T.paid) || '—'}</b></div><div class="irow"><span>Da incassare</span><b class="neon">${sumTxt(T.due) || '—'}</b></div>${coachTxt ? `<div class="irow"><span>Quota coach${d.coach_name ? ' (' + esc(d.coach_name) + ')' : ''}</span><b>− ${coachTxt}</b></div><div class="irow"><span>Resta a me</span><b>${sumTxt(mine)}</b></div>` : ''}<div class="irow"><span>Note spese non pagate</span><b style="color:var(--warn)">${sumTxt(open) || '—'}</b></div></div>
  <div class="section-title"><h2>Note spese</h2></div>
  ${notes.length ? `<div class="lbox">${notes.map((n) => { const e = S.events.find((x) => x.id === n.event_id); return `<div class="lrow" data-act="noteopen" data-id="${n.id}"><div class="grow" style="min-width:0"><div class="row between" style="gap:8px"><strong>N. ${esc(n.num)}</strong><span class="badge ${NSTATE[n.status]?.[1] || ''}">${NSTATE[n.status]?.[0]}${n.status === 'pagata' && n.paid_at ? ' ' + fmtShort(n.paid_at) : ''}</span></div><div class="subtle">${parse(n.date).toLocaleDateString(LOC())} · ${esc(e?.circuit || 'evento')}</div><div class="mono sm">${sumTxt(noteTotals(n.lines)) || '—'}</div></div>${n.status !== 'pagata' ? `<button class="btn small" data-act="notepaidq" data-id="${n.id}" style="border-color:var(--neon);color:var(--neon)">✓ Pagato</button>` : ''}</div>`; }).join('')}</div>` : '<p class="muted">Nessuna nota spese. A fine evento tocca “Genera nota spese”.</p>'}
  <div class="section-title"><h2>Riepilogo per fattura</h2></div>
  <div class="card"><div class="stat" style="font-size:22px">${sumTxt(invTot) || 'Niente da fatturare'}</div>
    <div class="subtle" style="margin:4px 0 10px">Compensi non incassati + spese a carico del pilota · ${lines.length} ${lines.length === 1 ? 'evento' : 'eventi'}${sumTxt(teamDue) ? `<br>Spese a carico del team, da chiedere a parte: <b>${sumTxt(teamDue)}</b>` : ''}</div>
    <div class="row wrap" style="gap:8px"><button class="btn small" data-act="invcopy" data-id="${d.id}">Copia testo</button>${bm.to ? `<button class="btn small" data-act="invgmail" data-id="${d.id}">Bozza in Gmail</button>` : ''}</div></div>
  </div><div class="colB">
  <div class="section-title"><h2>Attività per evento</h2></div>
  ${cards || '<p class="muted">Nessuna attività nel periodo.</p>'}
  ${loose.length ? `<div class="section-title"><h2>Altre attività</h2></div><div class="card aglist">${loose.map((a) => `<div data-act="agedit" data-id="${a.id}">• ${fmtShort(a.date)} ${a.date.slice(0, 4)} ${esc(a.start)} — ${esc(a.title)}</div>`).join('')}</div>` : ''}
  <div class="section-title"><h2>Costi</h2></div>
  <div class="card" style="padding:6px 10px">${exps.length ? `<table><tr><th>Categoria</th><th class="r">Totale</th></tr>${Object.entries(byCat).map(([k, o]) => `<tr><td>${CATS[k]}</td><td class="r mono">${sumTxt(o)}</td></tr>`).join('')}</table>
    <table style="margin-top:10px"><tr><th>Chi paga</th><th class="r">Da rimborsare</th><th class="r">Rimborsato</th></tr>${payRows}</table>` : '<p class="muted">Nessuna spesa nel periodo. Le spese si aggiungono aprendo un evento.</p>'}</div>
  <details style="margin-top:12px"><summary class="subtle" style="cursor:pointer">Modifica giorni e tipo per evento</summary>${driverSummary(d.id)}</details>
  </div></div>`;
}

/* ---------- CONTATTI FERRARI CHALLENGE ---------- */
const FCC_ROLES = ['Responsabile', 'Direttore gara', 'Segreteria sportiva', 'Logistica', 'Hospitality', 'Media / stampa', 'Tecnico Pirelli'];
function personRow(role, name, phone, email, editAttr, photo) {
  const ph = phone ? `<button type="button" class="cbtn" data-act="contact" data-k="tel" data-v="${esc(phone)}">☎</button>` : '<span class="cbtn off">☎</span>';
  const em = email ? `<button type="button" class="cbtn mail" data-act="contact" data-k="mail" data-v="${esc(email)}">✉</button>` : '<span class="cbtn off">✉</span>';
  const ini = (name || role || '?').split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
  const av = photo ? `<img class="pav" src="${photo}" alt="">` : `<div class="pav">${esc(ini)}</div>`;
  return `<div class="prow">${av}<div class="grow" style="min-width:0" ${editAttr || ''}><div class="lbl" style="margin:0">${esc(role)}</div><strong>${esc(name || 'da inserire')}</strong><div class="subtle" style="word-break:break-all">${esc([phone, email].filter(Boolean).join(' · ') || 'nessun contatto')}</div></div><div class="pbtns">${ph}${em}</div></div>`;
}
function fccForm(id, area, role) {
  const x = id ? S.fcc.find((z) => z.id === id) : { area, role: role || 'Responsabile', name: '', phone: '', email: '', notes: '' };
  openModal(id ? 'Contatto' : 'Nuovo contatto', `<form data-form="fcc" data-id="${id || ''}">
    <label class="f"><span>Area</span><select name="area">${fccAreas().map((a) => `<option value="${a.k}" ${a.k === x.area ? 'selected' : ''}>${a.flag} ${esc(a.name)}</option>`).join('')}</select></label>
    <div class="lbl" style="margin-bottom:6px">Mostra la stessa persona anche in</div>
    <div class="row wrap" style="gap:6px;margin-bottom:12px">${fccAreas().map((a) => `<label class="chip2"><input type="checkbox" name="also" value="${a.k}" ${(x.also || []).includes(a.k) ? 'checked' : ''}> ${a.flag} ${esc(a.name.replace('Ferrari Challenge', 'FC'))}</label>`).join('')}</div>
    <label class="f"><span>Ruolo</span><input name="role" list="fccroles" value="${esc(x.role)}"></label>
    <datalist id="fccroles">${FCC_ROLES.map((r) => `<option value="${r}">`).join('')}</datalist>
    <div class="row" style="margin-bottom:12px">${x.photo ? `<img class="avatar big" src="${x.photo}" alt="">` : `<div class="avatar big">${esc((x.name || '?')[0])}</div>`}<label class="f grow" style="margin:0"><span>Foto</span><input type="file" name="photo" accept="image/*"></label></div>
    <label class="f"><span>Nome</span><input name="name" value="${esc(x.name)}" required></label>
    <div class="grid2"><label class="f"><span>Telefono</span><input type="tel" name="phone" value="${esc(x.phone)}"></label><label class="f"><span>Mail</span><input type="email" name="email" value="${esc(x.email)}"></label></div>
    <label class="f"><span>Note</span><input name="notes" value="${esc(x.notes)}"></label>
    <div class="row between"><div>${id ? '<button type="button" class="btn danger" data-act="fccdel">Elimina</button>' : ''}</div><button class="btn primary" type="submit">Salva</button></div></form>`);
}

const BASE_DIRS = [{ id: 'FC', label: 'FC', name: 'Ferrari Challenge', bg: '#da291c', fg: '#ffd200', img: IMG_FC }, { id: 'IMSA', label: 'IMSA', name: 'IMSA', bg: '#0b2a5b', fg: '#ffffff', img: IMG_IMSA }];
const DIR_COLORS = [['#da291c', '#ffd200'], ['#0b2a5b', '#ffffff'], ['#111111', '#39ff14'], ['#ffd200', '#111111'], ['#2f80ff', '#ffffff'], ['#00a86b', '#ffffff'], ['#7b2cbf', '#ffffff'], ['#ff8c00', '#111111']];
function allDirs() { return [...BASE_DIRS, ...[...(S.dirs || [])].sort((a, b) => (a.order || 0) - (b.order || 0))]; }
function sqStyle(d) { return d.img ? `background:${d.imgbg || '#fff'} url('${d.img}') center/contain no-repeat;color:transparent` : `background:${d.bg};color:${d.fg};font-size:${d.label.length > 3 ? 10 : 12}px`; }
function dirSquares() { return allDirs().map((d) => `<button class="sq ${S.view === 'dir' && S.dirKey === d.id ? 'on' : ''}" data-act="diropen" data-id="${d.id}" title="${esc(d.name)}" style="${sqStyle(d)}">${d.img ? '' : esc(d.label)}</button>`).join('') + '<button class="sq plus" data-act="dirnew" title="Aggiungi un tasto">+</button>'; }
function fccAreas() {
  return [{ k: 'WORLD', name: 'Ferrari Challenge – Mondo', flag: '🌍', color: '#da291c', dir: 'FC' }, ...FC2027.map((f) => ({ k: f.key, name: f.name, flag: f.flag, color: f.color, f, dir: 'FC' })), { k: 'IMSA', name: 'IMSA', flag: '🇺🇸', color: '#0b2a5b', dir: 'IMSA' }, ...(S.dirs || []).map((d) => ({ k: d.id, name: d.name, flag: '', color: d.bg, dir: d.id }))];
}
function areaBox(a, title) {
  const list = (S.fcc || []).filter((x) => x.area === a.k || (x.also || []).includes(a.k)).sort((x, y) => (FCC_ROLES.indexOf(x.role) + 99) % 99 - (FCC_ROLES.indexOf(y.role) + 99) % 99 || (x.name || '').localeCompare(y.name || ''));
  const c = a.f ? fcMatch(a.f) : null;
  const rdChamp = c && (c.race_director_name || c.race_director_phone);
  const ph = (role) => `<div class="prow" data-act="fccnew" data-id="${a.k}" data-role="${role}" style="cursor:pointer;opacity:.55"><div class="grow"><div class="lbl" style="margin:0">${role}</div><strong>da inserire</strong><div class="subtle">Tocca per aggiungere telefono e mail</div></div><span class="chev">＋</span></div>`;
  return `<div class="fccbox" style="--cc:${a.color}"><div class="row between" style="gap:8px;margin-bottom:6px"><h2 style="font-size:17px">${title || (a.flag + ' ' + esc(a.name))}</h2><button class="btn small" data-act="fccnew" data-id="${a.k}">+ Scheda</button></div>
    ${list.some((x) => x.role === 'Responsabile') ? '' : ph('Responsabile')}
    ${list.map((x) => personRow(x.role || 'Contatto', x.name, x.phone, x.email, `data-act="fccedit" data-id="${x.id}" style="cursor:pointer"`, x.photo)).join('')}
    ${rdChamp ? personRow('Direttore gara (dal campionato)', c.race_director_name, c.race_director_phone, null) : list.some((x) => x.role === 'Direttore gara') ? '' : ph('Direttore gara')}</div>`;
}
function dirView() {
  const d = allDirs().find((x) => x.id === S.dirKey) || BASE_DIRS[0];
  const custom = !BASE_DIRS.some((x) => x.id === d.id);
  const areas = fccAreas().filter((a) => a.dir === d.id);
  return `<div class="row between wrap" style="gap:10px;margin-bottom:14px"><div class="row" style="gap:12px"><span class="sq big" style="${sqStyle(d)}">${d.img ? '' : esc(d.label)}</span><div><h1 style="font-size:26px">${esc(d.name)}</h1><div class="subtle">Contatti: tocca un nome per modificarlo, ☎ chiama, ✉ scrivi</div></div></div>
    <span class="row" style="gap:6px">${custom ? `<button class="btn small" data-act="diredit" data-id="${d.id}">✎ Tasto</button>` : ''}<button class="btn primary small" data-act="fccnew" data-id="${areas[0]?.k || d.id}">+ Scheda</button></span></div>
    <div class="fccgrid">${areas.map((a) => areaBox(a, d.id === 'FC' ? null : 'Contatti')).join('')}</div>`;
}
function dirForm(id) {
  const d = id ? S.dirs.find((x) => x.id === id) : { label: '', name: '', bg: DIR_COLORS[2][0], fg: DIR_COLORS[2][1] };
  openModal(id ? 'Modifica tasto' : 'Nuovo tasto', `<form data-form="dir" data-id="${id || ''}">
    <label class="f"><span>Sigla sul tasto (max 4 lettere)</span><input name="label" maxlength="4" value="${esc(d.label)}" required placeholder="es. GT, F1, WEC"></label>
    <label class="f"><span>Nome</span><input name="name" value="${esc(d.name)}" required placeholder="es. GT World Challenge"></label>
    <label class="f"><span>Immagine o logo (facoltativo, al posto della sigla)</span><input type="file" name="img" accept="image/*"></label>
    <div class="lbl" style="margin-bottom:6px">Colore</div><div class="row wrap" style="gap:8px;margin-bottom:14px">${DIR_COLORS.map(([bg, fg], i) => `<label style="cursor:pointer"><input type="radio" name="col" value="${i}" ${d.bg === bg ? 'checked' : ''} style="display:none"><span class="sq colpick" style="background:${bg};color:${fg}">Aa</span></label>`).join('')}</div>
    <div class="row between"><div>${id ? '<button type="button" class="btn danger" data-act="dirdel">Elimina</button>' : ''}</div><button class="btn primary" type="submit">Salva</button></div></form>`);
}
async function saveDir(f) {
  const fd = new FormData(f), id = f.dataset.id || 'D' + uuid().slice(0, 8);
  const [bg, fg] = DIR_COLORS[+(fd.get('col') ?? 2)] || DIR_COLORS[2];
  const old = (S.dirs || []).find((x) => x.id === id);
  const file = fd.get('img'); let img = old?.img || null;
  if (file && file.size) img = await blobToDataURL(await resizeImage(file, 112, 0.9));
  await put('dirs', { ...(old || {}), img, id, label: fd.get('label').toString().trim().toUpperCase().slice(0, 4), name: fd.get('name').toString().trim(), bg, fg, order: old?.order ?? (S.dirs || []).length + 1 });
  closeModal(); S.dirKey = id; S.view = 'dir'; render(); toast('Tasto salvato');
}

const SESS_TYPES = ['Prove libere', 'Test', 'Qualifica', 'Gara 1', 'Gara 2', 'Gara 3', 'Griglia di partenza'];
const LAP_RE = /\b\d{1,2}:\d{2}\.\d{3}\b/g;
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Non riesco a caricare il lettore PDF')); document.head.appendChild(s); }); }
async function receiptDataUrl(file) {
  const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name || '');
  if (!isPdf) return blobToDataURL(await resizeImage(file, 1000, 0.65));
  if (!window.pdfjsLib) {
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js');
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js');
  }
  const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const pg = await pdf.getPage(1), v0 = pg.getViewport({ scale: 1 }), v = pg.getViewport({ scale: 1100 / Math.max(v0.width, v0.height) });
  const c = document.createElement('canvas'); c.width = Math.round(v.width); c.height = Math.round(v.height);
  const cx = c.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, c.width, c.height);
  await pg.render({ canvasContext: cx, viewport: v }).promise;
  return c.toDataURL('image/jpeg', 0.7);
}
async function pdfLines(file) {

  }
  const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const out = [];
  for (let p = 1; p <= pdf.numPages; p++) {

function teamLogo(t) { return t.logo_data || (TEAM_LOGOS.find(([re]) => re.test(t.name || '')) || [])[1] || ''; }
function teamCard(t) {
  const ds = teamDrivers(t), lg = teamLogo(t);
  const col = ds.map((d) => champ(d.championship_id)?.color).find(Boolean) || (t.region === 'US' || t.region === 'CA' ? '#2f80ff' : t.region === 'EU' ? '#ff3b30' : '#39ff14');
  const ini = (t.name || '?').replace(/[^A-Za-z0-9 ]/g, '').split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
  const ph = t.manager_phone || t.owner_phone, em = t.manager_email || t.owner_email;
  return `<div class="tcard" data-act="team" data-id="${t.id}"><div class="tlogo" style="${lg ? `background-image:url('${lg}')` : `--pc:${col}`}">${lg ? '' : `<span>${esc(ini)}</span>`}</div>
    <div class="tbody"><div class="row between" style="gap:8px;align-items:flex-start"><div style="min-width:0"><strong class="tname">${esc(t.name)}</strong><div class="subtle">${esc(REGIONS[t.region] || 'Altro')}${t.city ? ' · ' + esc(t.city) : ''} · ${ds.length} ${ds.length === 1 ? 'pilota' : 'piloti'}</div></div><span class="dbtns trow"><button type="button" class="cbtn sm ${ph ? '' : 'off'}" ${ph ? `data-act="contact" data-k="tel" data-v="${esc(ph)}"` : `data-act="team" data-id="${t.id}"`} aria-label="Chiama">☎</button><button type="button" class="cbtn sm mail ${em ? '' : 'off'}" ${em ? `data-act="contact" data-k="mail" data-v="${esc(em)}"` : `data-act="team" data-id="${t.id}"`} aria-label="Scrivi">✉</button></span></div></div></div>`;
}
function teamsView() {
  const all = [...(S.teams || [])].sort((a, b) => teamDrivers(b).length - teamDrivers(a).length || a.name.localeCompare(b.name));

  return segPD('teams') + `<div class="row between wrap" style="margin-bottom:6px"><h1 style="font-size:30px">Team</h1><span class="row" style="gap:6px"><button class="btn small" data-act="teamall">${S.teamAll ? 'Solo i miei' : 'Tutti (' + all.length + ')'}</button><button class="btn primary small" data-act="teamnew">+ Team</button></span></div>
    <p class="subtle" style="margin:0 0 14px">${S.teamAll ? 'Tutti i team in elenco.' : 'I team dei tuoi piloti e quelli con contatti.'} Tocca un team per la scheda.</p>

}

function parseVcf(txt) {
  const out = [];
  txt.replace(/\r/g, '').replace(/\n[ \t]/g, '').split(/BEGIN:VCARD/i).slice(1).forEach((blk) => {
    const get = (re) => { const m = blk.match(re); return m ? m[1].trim() : ''; };
    let name = get(/^FN[^:\n]*:(.*)$/im);
    if (!name) { const n = get(/^N[^:\n]*:(.*)$/im).split(';'); name = ((n[1] || '') + ' ' + (n[0] || '')).trim(); }
    const tels = [...blk.matchAll(/^TEL[^:\n]*:(.*)$/gim)].map((m) => m[1].trim()).filter(Boolean);
    const phone = tels[0] || '';
    const email = get(/^EMAIL[^:\n]*:(.*)$/im);
    const org = get(/^ORG[^:\n]*:(.*)$/im).replace(/;+/g, ' ').trim();
    if (name || phone || email) out.push({ name: name || org || phone, phone, email, org });
  });
  return out;
}

async function importAll(f) {
  const txt = (new FormData(f).get('json') || '').toString().trim();
  let obj; try { obj = JSON.parse(txt); } catch (_) { return toast('Testo non valido', true); }
  const cols = obj && obj.collections; if (!cols) return toast('Non sono i dati di MB Coaching', true);
  const sb = window.__sb; toast('Importo… non chiudere la pagina');
  let n = 0;
  for (const t of Object.values(TABLES)) {
    const arr = cols[t]; if (!Array.isArray(arr)) continue;
    const de = (await sb.from('docs').delete().eq('col', t)).error; if (de) return toast('Errore: ' + de.message, true);
    for (let i = 0; i < arr.length; i += 15) {
      const rows = arr.slice(i, i + 15).map((x) => { const { id, ...rest } = x; return { col: t, id: String(id), data: rest, updated_at: new Date().toISOString() }; });
      const er = (await sb.from('docs').upsert(rows)).error; if (er) return toast('Errore: ' + er.message, true);
      n += rows.length;
    }
  }
  closeModal(); await loadAll(); sortAll(); render(); toast('Importati ' + n + ' elementi');
}

  closeModal(); toast('Password cambiata');
}
async function saveTeam(f) {

  row.role_labels = {}; TROLES.forEach(([k, l]) => { const x = v(k + '_label'); if (x && x !== l) row.role_labels[k] = x; });

  await put('teams', row);
  S.teams.sort((a, b) => a.name.localeCompare(b.name));

}

const GPAL = { 1: '#a4bdfc', 2: '#7ae7bf', 3: '#dbadff', 4: '#ff887c', 5: '#fbd75b', 6: '#ffb878', 7: '#46d6db', 8: '#e1e1e1', 9: '#5484ed', 10: '#51b749', 11: '#dc2127' };
function colorId(hex) {
  const h = (x) => [1, 3, 5].map((i) => parseInt(x.slice(i, i + 2), 16));
  const [r, g, b] = h(hex);
  let best = 10, bd = 1e9;
  for (const [k, v] of Object.entries(GPAL)) { const [R, G, B] = h(v); const d = (r - R) ** 2 + (g - G) ** 2 + (b - B) ** 2; if (d < bd) { bd = d; best = k; } }
  return String(best);
}

/* ---------- GOOGLE CALENDAR (connettore di Claude) ---------- */
const GSRV = 'Google Calendar';
async function gcall(tool, input) {
  if (!MCP) { const e = new Error('Collegamento Google non disponibile'); e.code = 'nomcp'; throw e; }
  const r = await MCP.callTool(GSRV, tool, input);
  return r.payload && typeof r.payload === 'object' ? r.payload : {};
}
function gerr(err) {
  const c = err && err.code;
  if (c === 'nomcp') return 'Collegamento Google non disponibile in questa vista';
  if (c === 'server_not_connected' || c === 'selection_required') return 'Collega Google Calendar tra i connettori di Claude e riprova';
  if (c === 'needs_reauth') return 'Riconnetti Google Calendar tra i connettori di Claude';
  if (c === 'approval_required' || c === 'consent_required') return 'Serve il tuo consenso: tocca Sincronizza e scegli Consenti';
  if (c === 'not_in_manifest') return 'Questa pagina non ha il permesso di usare Google Calendar';
  return 'Errore Google: ' + String((err && err.message) || c || err).slice(0, 120);
}
function gFields(e) {
  const d = driver(e.driver_id), t = atype(e.activity_type_id), c = champ(e.championship_id);
  const lines = [
    c ? `Campionato: ${c.name}` : null, e.nation ? `Nazione: ${e.nation}` : null,
    e.hotel_name ? `Hotel: ${e.hotel_name}${e.hotel_address ? ', ' + e.hotel_address : ''}` : null,
    e.hotel_arrive ? `Soggiorno: ${fmtShort(e.hotel_arrive)} - ${fmtShort(e.hotel_depart || e.hotel_arrive)} ${e.hotel_arrive.slice(0, 4)}` : null,
    e.hotel_conf ? `Conferme: ${e.hotel_conf}` : null,
    e.hotel_phone ? `Tel. hotel: ${e.hotel_phone}` : null,
    ...flightGroups(e).map(([n, v]) => `Voli ${n}:\n${v}`),
    carText(e) ? 'Auto: ' + carText(e) : null,
    e.engineer_name ? `Ingegnere: ${e.engineer_name} ${e.engineer_phone || ''}` : null,
    e.mechanic_name ? `Meccanico: ${e.mechanic_name} ${e.mechanic_phone || ''}` : null,
    e.race_director_name ? `Direttore gara: ${e.race_director_name} ${e.race_director_phone || ''}` : null,
    e.notes
  ].filter(Boolean);
  return {
    summary: `${dname(d)} · ${t?.name || ''}${c ? ' · ' + c.name : ''}`,
    location: [e.circuit, e.nation].filter(Boolean).join(', '),
    description: lines.concat([`MBC-ID:${e.id}`]).join('\n'),
    startTime: `${e.start_date}T00:00:00`,
    endTime: `${iso(addDays(parse(e.end_date), 1))}T00:00:00`,
    allDay: true,
    colorId: colorId(evColor(e)),
    notificationLevel: 'NONE'
  };
}
async function gPush(e) {
  let id = e.google_event_id;
  if (id) await gcall('update_event', { eventId: id, ...gFields(e) });
  else id = (await gcall('create_event', gFields(e))).id;
  if (!id) throw new Error('Google non ha restituito l\'evento');
  await put('events', { ...(S.events.find((x) => x.id === e.id) || e), google_event_id: id, dirty: false });
}
async function autoPush(id) {
  if (!MCP) return;
  try { const e = S.events.find((x) => x.id === id); if (e) { await gPush(e); render(); } } catch (err) { /* resta da sincronizzare */ }
}
let gSyncing = false;
async function syncGoogle() {
  if (gSyncing) return;
  if (!MCP) return toast(gerr({ code: 'nomcp' }), true);
  gSyncing = true;
  try {
    toast('Sincronizzazione…');
    const min = new Date(); min.setFullYear(min.getFullYear() - 2);
    const max = new Date(); max.setFullYear(max.getFullYear() + 3);
    const items = []; let token = null;
    do {
      const r = await gcall('list_events', { fullText: 'MBC-ID', startTime: `${iso(min)}T00:00:00`, endTime: `${iso(max)}T00:00:00`, pageSize: 250, ...(token ? { pageToken: token } : {}) });
      items.push(...(r.events || [])); token = r.nextPageToken || null;
    } while (token);
    const byId = new Map(items.map((g) => [g.id, g]));
    let pushed = 0, pulled = 0; const gone = [];
    for (const e of [...S.events]) {
      const g = e.google_event_id ? byId.get(e.google_event_id) : null;
      const inRange = e.start_date >= iso(min) && e.end_date <= iso(max);
      if (e.google_event_id && (!g || g.status === 'cancelled')) {
        if (!inRange) continue;
        if (e.dirty) { await gPush({ ...e, google_event_id: null }); pushed++; } else gone.push(e.id);
        continue;
      }
      if (!e.google_event_id || e.dirty) { await gPush(e); pushed++; continue; }
      const gs = String(g.start?.date || g.start?.dateTime || '').slice(0, 10);
      const ge = g.end?.date ? iso(addDays(parse(String(g.end.date).slice(0, 10)), -1)) : String(g.end?.dateTime || '').slice(0, 10);
      if (gs && ge && (gs !== e.start_date || ge !== e.end_date)) {
        await put('events', { ...e, start_date: gs, end_date: ge, days: diffDays(gs, ge), dirty: false });
        pulled++;
      }
    }
    render();
    toast(`Google: ${pushed} inviati, ${pulled} aggiornati da Google${gone.length ? `, ${gone.length} eliminati su Google` : ''}`);
    if (gone.length) {
      S.gone = gone;
      openModal('Eliminati su Google', `<p>Questi eventi non esistono più su Google Calendar:</p>
        ${gone.map((id) => { const e = S.events.find((x) => x.id === id); return `<div class="ev-item"><div class="bar" style="background:${evColor(e)}"></div><div class="grow"><strong>${esc(dname(driver(e.driver_id)))}</strong><div class="subtle">${fmtRange(e.start_date, e.end_date)}</div></div></div>`; }).join('')}
        <div class="row wrap"><button class="btn danger" data-act="gone-del">Elimina anche qui</button><button class="btn primary" data-act="gone-keep">Ricrea su Google</button></div>`);
    }
  } catch (err) { toast(gerr(err), true); }
  finally { gSyncing = false; }
}

      case 'expinline': await saveExpInline(f); break;
      case 'dir': await saveDir(f); break;
      case 'fcc': { const fd = new FormData(f), v = (n) => (fd.get(n) || '').toString().trim() || null; const id = f.dataset.id || uuid(); const old = (S.fcc || []).find((z) => z.id === id); const pf = fd.get('photo'); let photo = old?.photo || null; if (pf && pf.size) photo = await blobToDataURL(await resizeImage(pf, 240, 0.85)); await put('fcc', { ...(old || {}), id, area: v('area'), role: v('role'), name: v('name'), phone: v('phone'), email: v('email'), notes: v('notes'), photo, also: fd.getAll('also').filter((k) => k !== v('area')) }); closeModal(); render(); toast('Contatto salvato'); break; }
      case 'note': await saveNote(f, f.dataset.how || 'save'); break;
      case 'notepaid': await notePaid(f); break;
      case 'mail': await sendMail(f, f.dataset.how || 'draft'); break;
      case 'refadd': {
        const key = f.dataset.key, name = new FormData(f).get('name').toString().trim();
        if (!name) { toast('Scrivi il nome', true); break; }
        if (S[key].some((x) => x.name.toLowerCase() === name.toLowerCase())) { toast(`"${name}" è già nell'elenco`, true); break; }
        await put(key, { id: uuid(), name, region: new FormData(f).get('region') || null });
        S[key].sort((a, b) => a.name.localeCompare(b.name));
        render(); toast(`Aggiunto: ${name}`); break;
      }
      case 'planadd': {
        const fd = new FormData(f);
        const n = await planSave(fd.get('type'), [{ name: fd.get('name').toString().trim(), nat: (fd.get('nat') || '').toString().trim() || null, s: fd.get('s'), e: (fd.get('e') && fd.get('e') >= fd.get('s')) ? fd.get('e') : fd.get('s') }]);
        closeModal(); render(); toast(n ? 'Evento aggiunto' : 'Gi\u00e0 presente'); break;
      }
      case 'planfile': {
        const fd = new FormData(f);
        const file = fd.get('file');
        const text = (file && file.size ? await file.text() : '') || (fd.get('paste') || '').toString();
        const items = parseRacePlan(text);
        if (!items.length) { toast('Non trovo eventi nel file: controlla intestazioni e date', true); break; }
        const n = await planSave(fd.get('type'), items);
        closeModal(); render(); toast(`${n} eventi importati su ${items.length}`); break;
      }
      case 'deadline': {
        const fd = new FormData(f);
        const id = f.dataset.id || uuid();
        const old = S.deadlines.find((x) => x.id === id);
        await put('deadlines', { ...(old || {}), id, name: fd.get('name').toString().trim(), date: fd.get('date'), who: fd.get('who') || '', note: (fd.get('note') || '').toString().trim() });
        S.deadlines.sort((a, b) => a.date.localeCompare(b.date));
        closeModal(); render(); toast('Scadenza salvata'); break;
      }
      case 'fcgo': await fcCommit(f); break;
      case 'expense': await saveExpense(f); break;
      case 'driver': await saveDriver(f); break;
      case 'champ': await saveSimple('champs', f, (fd) => ({ name: fd.get('name').toString().trim(), region: (fd.get('region') || '').toString().trim() || '—', color: fd.get('color'), race_director_name: fd.get('race_director_name') || null, race_director_phone: fd.get('race_director_phone') || null, results_url: (fd.get('results_url') || '').toString().trim() || null })); break;
      case 'type': await saveSimple('types', f, (fd) => { const needs = fd.get('needs_championship') === 'on'; return { name: fd.get('name').toString().trim(), needs_championship: needs, color: needs ? null : fd.get('color'), sort_order: (S.types.find((x) => x.id === f.dataset.id)?.sort_order) ?? S.types.length + 1 }; }); break;
    }
  } catch (err) { toast('Errore: ' + (err.message || err.code || err), true); }
  finally { if (btn) btn.disabled = false; }
});

/* ---------- avvio ---------- */
async function init() {
  startI18n();
  render();
  const c = window.claude;
  if (!c || !c.use) { S.err = 'Questa pagina funziona dentro Claude.'; render(); return; }
  DB = await c.use('db');
  MCP = await c.use('mcp');
  if (!DB) { S.err = 'Archivio dati non disponibile in questa vista.'; render(); return; }
  try { await loadAll(); } catch (err) { S.err = 'Errore nel caricamento: ' + (err.message || err.code); render(); return; }
  try {
    let seen = false;
    try { seen = localStorage.getItem('mbc_seed_refs') === '1'; } catch (_) { /* nessun archivio locale */ }
    if (!seen && !S.dealers.length && !S.teams.length) { await seedRefs(); try { localStorage.setItem('mbc_seed_refs', '1'); localStorage.setItem('mbc_seed_refs2', '1'); } catch (_) { /* ok */ } }
    else {
      let s2 = false;
      try { s2 = localStorage.getItem('mbc_seed_refs2') === '1'; } catch (_) { /* nessun archivio locale */ }
      if (!s2 && (S.dealers.length || S.teams.length)) { await seedRefs(SEED_REFS2); try { localStorage.setItem('mbc_seed_refs2', '1'); } catch (_) { /* ok */ } }
    }
  } catch (_) { /* gli elenchi restano vuoti */ }
  try { const lp = (S.prefs || []).find((x) => x.id === 'lang'); if (lp && lp.v && lp.v !== LANG) { LANG = lp.v === 'en' ? 'en' : 'it'; try { localStorage.setItem('mbc_lang', LANG); } catch (_) { /* ok */ } } } catch (_) { /* ok */ }
  document.documentElement.lang = LANG;
  render();
}
window.__mbStart = init;
})();

</script>
