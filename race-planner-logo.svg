<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300">
  <rect width="720" height="300" rx="28" fill="#0f1b3d"/>
  <!-- emblema: cronometro con tracciato -->
  <g transform="translate(40,50)">
    <rect x="86" y="0" width="28" height="16" rx="4" fill="#e10600"/>
    <circle cx="100" cy="112" r="92" fill="none" stroke="#ffffff" stroke-width="10"/>
    <circle cx="100" cy="112" r="76" fill="#16275a"/>
    <!-- tracciato di gara -->
    <path d="M52 140 C52 100 80 96 96 110 C112 124 120 82 144 84 C170 86 160 140 128 148 C100 154 80 168 62 160 C54 156 52 148 52 140 Z"
          fill="none" stroke="#ffffff" stroke-width="7" stroke-linejoin="round"/>
    <!-- linea di partenza a scacchi -->
    <g transform="translate(88,142) rotate(-20)">
      <rect x="0" y="0" width="8" height="8" fill="#fff"/><rect x="8" y="8" width="8" height="8" fill="#fff"/>
      <rect x="8" y="0" width="8" height="8" fill="#e10600"/><rect x="0" y="8" width="8" height="8" fill="#e10600"/>
    </g>
    <!-- lancetta -->
    <line x1="100" y1="112" x2="100" y2="58" stroke="#e10600" stroke-width="7" stroke-linecap="round"/>
    <circle cx="100" cy="112" r="8" fill="#e10600"/>
  </g>
  <!-- testo -->
  <text x="268" y="140" font-family="Helvetica Neue, Arial, sans-serif" font-size="68" font-weight="800" fill="#ffffff" letter-spacing="2">RACE</text>
  <text x="268" y="206" font-family="Helvetica Neue, Arial, sans-serif" font-size="68" font-weight="800" fill="#e10600" letter-spacing="2">PLANNER</text>
  <rect x="268" y="224" width="400" height="4" fill="#ffffff" opacity=".35"/>
  <text x="268" y="256" font-family="Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="600" fill="#ffffff" letter-spacing="5">SCUDERIA DE ADAMICH</text>
</svg>
